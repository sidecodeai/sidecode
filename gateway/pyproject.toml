[project]
name = "rc-gateway"
version = "1.18.4"
description = "SideCode gateway: routes apps and devices, indexes sessions, proxies STT and push"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "httpx[http2]>=0.27",
    "python-dotenv>=1.0",
    "cryptography>=43",
    "pywebpush>=2.0",
    "py-vapid>=1.9",
    "python-multipart>=0.0.9",
]

[project.scripts]
rc-gateway = "rc_gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rc_gateway"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-timeout>=2.4.0",
    "jsonschema>=4.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["rc_gateway", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pywebpush.*", "py_vapid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
